[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trantor"
version = "0.1.0"
description = "Foundation for a COMEX gold futures research and trading system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
