[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trantor"
version = "0.2.0"
description = "XAUUSD-P research, shadow and paper trading system (no broker order path)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trantor = ["dashboard/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
